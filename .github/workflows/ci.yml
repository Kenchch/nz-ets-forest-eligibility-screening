name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Verify pinned inputs
        run: python scripts/verify_checksums.py
      - name: Reproduce Gisborne outputs
        run: python scripts/reproduce.py
      - name: Verify deterministic evidence tables
        run: |
          git diff --exit-code -- "outputs/gisborne/*.csv" "outputs/gisborne/findings.json" "outputs/gisborne/review/*.csv"
      - name: Verify semantic GeoPackage content
        run: python scripts/semantic_hashes.py
