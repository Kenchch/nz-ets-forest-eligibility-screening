name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so drift in the runner image, uv or an action shows up on its own
  # rather than on the next unrelated pull request.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test-and-reproduce:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Every step runs the built package rather than src/, so the tests also
      # catch a vendored map asset or the rule register missing from it.
      UV_NO_EDITABLE: "1"
    steps:
      # Actions are pinned to full commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs Python too, so this replaces setup-python.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # From uv.lock, exactly. The committed outputs are checked below against
      # a fresh run, so the versions that produce them have to be the versions
      # the lock names; `pip install -e ".[dev]"` resolved the open ranges in
      # pyproject.toml to whatever was newest that day. --locked fails if the
      # lock no longer matches pyproject.toml.
      - name: Install
        run: uv sync --locked --group notebook
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Verify pinned inputs
        run: uv run python scripts/verify_checksums.py
      - name: Reproduce Gisborne outputs
        run: uv run python scripts/reproduce.py
      - name: Verify deterministic evidence tables
        shell: bash
        run: |
          # Cover every regenerated text artefact, not a hand-listed subset.
          #
          # GeoPackages are verified by semantic_hashes.py instead, and the
          # Matplotlib PNG/PDF pages embed renderer output, so neither is
          # byte-comparable across this matrix. `glob` magic is required:
          # without it `**/` needs at least one directory, so the top-level
          # GeoPackages and PDF were compared byte for byte.
          git diff --exit-code -- outputs/gisborne \
            ':(exclude,glob)outputs/gisborne/**/*.gpkg' \
            ':(exclude,glob)outputs/gisborne/**/*.png' \
            ':(exclude,glob)outputs/gisborne/**/*.pdf' \
            ':(exclude,glob)outputs/gisborne/review/cards/**'
      - name: Verify no output file appeared or vanished
        shell: bash
        run: |
          # git diff never inspects untracked files, so an artefact that is
          # renamed or newly emitted ships silently even when its path matches
          # the pathspec above.
          untracked="$(git ls-files --others --exclude-standard -- outputs/gisborne)"
          deleted="$(git ls-files --deleted -- outputs/gisborne)"
          if [ -n "$untracked" ] || [ -n "$deleted" ]; then
            [ -n "$untracked" ] && { echo "untracked outputs:"; echo "$untracked"; }
            [ -n "$deleted" ] && { echo "missing committed outputs:"; echo "$deleted"; }
            exit 1
          fi
      - name: Verify no basemap key was published
        shell: bash
        run: |
          if grep -RIlE "api=[A-Za-z0-9_-]{8,}" outputs/; then
            echo "a LINZ basemap API key appears in a generated output"
            exit 1
          fi
      - name: Verify semantic GeoPackage content
        run: uv run python scripts/semantic_hashes.py
      - name: Execute the derivation notebook
        shell: bash
        run: |
          uv run python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          path = "notebooks/01_width_rule_comparison.ipynb"
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=600, resources={"metadata": {"path": "notebooks"}}).execute()
          PY

      # Nothing else runs the trace, so a change that breaks it would otherwise
      # pass CI. It writes only under outputs/trace/ (ignored), so it goes after
      # the checks above and cannot affect what they compare. It logs mismatches
      # rather than failing on them; the checks above fail on those. About two
      # minutes.
      - name: The pipeline trace runs end to end
        run: uv run python scripts/trace_pipeline.py

  latest-dependencies:
    # Early warning only: the reproducible build installs uv.lock.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # --upgrade resolves every dependency afresh, ignoring the lock's pins,
      # in this runner's checkout only.
      - name: Install latest releases
        run: uv sync --upgrade
      - name: Test
        run: uv run pytest
