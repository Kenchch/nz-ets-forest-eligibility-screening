name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Verify pinned demonstration inputs
        run: python scripts/verify_checksums.py
      - name: Reproduce demonstration outputs
        run: python scripts/reproduce.py
      - name: Verify committed summaries are reproducible
        run: git diff --exit-code -- outputs/summary.csv outputs/rule_results.csv outputs/width_method_comparison.csv
