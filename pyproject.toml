[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nz-ets-forest-eligibility-screening"
version = "0.1.0"
description = "Auditable spatial triage for selected NZ ETS post-1989 forest-land criteria"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Feng Jiang"}]
dependencies = [
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "pillow>=11.0",
  "pyogrio>=0.10",
  "pyproj>=3.7",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
ets-screen = "ets_screening.screen:main"
ets-review-sample = "ets_screening.sample_review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_tmp"
testpaths = ["tests"]
# scripts/ is not a package; this lets tests import its modules the way
# reproduce.py imports build_findings.
pythonpath = ["scripts"]

[tool.setuptools.package-data]
ets_screening = ["vendor/leaflet-1.9.4/*"]
